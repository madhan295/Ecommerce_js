<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ecommerce-JS</title>
 <link href="/images/icons/favicon.png" rel="icon">
 <link href="/styles/shared/header.css" rel="stylesheet">
 <link rel="stylesheet" href="/styles/pages/wishlistpage.css">
</head>
<body>

  <nav class="navbar">
  <a href="homepage.html">
   <img src="/images/icons/logo.png" alt="logo" class="logo">
  </a>

  <div class="input-container">
   <img src="/images/icons/search.png" alt="search icon" class="search-icon">
   <input type="text" placeholder="Search modern tech, furniture, audio..." class="input-text-box">
  </div>

  <div class="features-container">
   <a class="wishlist-container" href="wishlistpage.html">
    <div class="icon-wrapper">
      <img class="wishlist-img" src="/images/icons/wishlist.png" alt="Wishlist">
      <span class="wishlist-counter js-wishlist-counter">0</span>
    </div>
    <p class="feature-label">Wishlist</p>
   </a>

   <a class="cart-container" href="checkoutpage.html">
    <div class="icon-wrapper">
      <img class="cart-img" src="images/icons/cart.png" alt="Cart">
      <span class="quantity-counter js-quantity-counter">0</span>
    </div>
    <p class="feature-label">Cart</p>
   </a> 
  </div>
 </nav>

 <main style="padding-top: 140px">

  <div class="page-details">
    <div class="page-details-left">
      <p class="heading">Saved Collections</p>
      <p class="description">Curated products saved for later. Real-time monitoring tracks price dips,
active promotional discounts, and restock batches automatically.</p>
    </div>

    <div class="page-details-right">
      <span class="wishlist-count js-wishlist-count">5 items</span>
    </div>
  </div>

  <div class="products-grid js-products-grid">
  </div>

 </main>

 <script type="module" src="/scripts/wishlist.js"></script>
</body>
</html>
