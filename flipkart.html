<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Flipkart</title>
 <link href="/images/icons/flipkart-favicon.png" rel="icon">
 <link href="/styles/shared/header.css" rel="stylesheet">
 <link href="/styles/pages/flipkart.css" rel="stylesheet">
</head>
<body>

 <nav class="navbar">
  <img src="/images/icons/flipkart-logo.png" alt="flipkart logo" class="logo">

  <div class="input-container">
   <input type="text" placeholder="Search for your product" class="input-text-box">
   <img src="/images/icons/icons8-search.svg" alt="search icon" class="search-icon">
  </div>

  <div class="features-container">
   <div class="wishlist-container">
    <img class="wishlist-img" src="/images/icons/wishlist.svg">
    <p>Wishlist</p>
   </div>

   <div class="cart-container">
    <img class="cart-icon" src="images/icons/cart.svg">
    <div class="quantity-counter">
     <p>0</p>
    </div>
    <p>Cart</p>
   </div>
  </div>
 </nav>
 
</body>
</html>
