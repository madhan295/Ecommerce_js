<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ecommerce-JS</title>
 <link href="/images/icons/favicon.png" rel="icon">
 <link href="/styles/shared/header.css" rel="stylesheet">
 <link href="/styles/pages/homepage.css" rel="stylesheet">
</head>
<body>

 <nav class="navbar">
  <a href="homepage.html">
   <img src="/images/icons/logo.png" alt="logo" class="logo">
  </a>

  <div class="input-container">
   <img src="/images/icons/search.png" alt="search icon" class="search-icon">
   <input type="text" placeholder="Search modern tech, furniture, audio..." class="input-text-box">
  </div>

  <div class="features-container">
   <a class="wishlist-container" href="wishlistpage.html">
    <div class="icon-wrapper">
      <img class="wishlist-img" src="/images/icons/wishlist.png" alt="Wishlist">
      <span class="wishlist-counter">0</span>
    </div>
    <p class="feature-label">Wishlist</p>
   </a>

   <a class="cart-container" href="cartpage.html">
    <div class="icon-wrapper">
      <img class="cart-img" src="images/icons/cart.png" alt="Cart">
      <span class="quantity-counter">0</span>
    </div>
    <p class="feature-label">Cart</p>
   </a> 
  </div>
 </nav>
 
 <main>
  
  <div class="page-details">
    <div class="page-details-left">
      <p class="heading">Products Catalog</p>
      <p class="description">Select your desired quantity directly on each product card and add to you cart.</p>
    </div>

    <div class="page-details-right">
      <label for="sort" class="sort-label">Sort by:</label>
        <select name="sort" id="sort" class="sort">
          <option value="pricelowtohigh">Price low to high</option>
          <option value="pricehightolow">Price high to low</option>
          <option value="reviewhightolow">Review high to low</option>
          <option value="reviewlowtohigh">Review low to high</option>
        </select>
      </label>
    </div>
  </div>

  <div class="products-grid js-products-grid">
  </div>
  
 </main>

 <script src="/data/product.js"></script>
 <script src="/scripts/homepage.js"></script>
</body>
</html>
