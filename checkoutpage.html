<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ecommerce-JS</title>
 <link href="/images/icons/favicon.png" rel="icon">
 <link href="/styles/shared/header.css" rel="stylesheet">
 <link rel="stylesheet" href="/styles/pages/checkoutpage.css">
</head>
<body>
 <nav class="navbar">
  <a href="homepage.html">
   <img src="/images/icons/logo.png" alt="logo" class="logo">
  </a>

  <div class="input-container">
   <img src="/images/icons/search.png" alt="search icon" class="search-icon">
   <input type="text" placeholder="Search modern tech, furniture, audio..." class="input-text-box">
  </div>

  <div class="features-container">
   <a class="wishlist-container" href="wishlistpage.html">
    <div class="icon-wrapper">
      <img class="wishlist-img" src="/images/icons/wishlist.png" alt="Wishlist">
      <span class="wishlist-counter">0</span>
    </div>
    <p class="feature-label">Wishlist</p>
   </a>

   <a class="cart-container" href="checkoutpage.html">
    <div class="icon-wrapper">
      <img class="cart-img" src="images/icons/cart.png" alt="Cart">
      <span class="quantity-counter">0</span>
    </div>
    <p class="feature-label">Cart</p>
   </a> 
  </div>
 </nav>

 <main style="padding-top: 140px">
  <div class="page-details">
    <div class="page-details-left">
      <p class="heading">Saved Collections</p>
      <p class="description">4 items stored for later evaluation & checkout</p>
    </div>

    <div class="page-details-right">
      <img src="/images/icons/close.png" alt="" class="close-icon">
      <span>Clear</span>
    </div>
  </div>

  <div class="main-container">
   <div class="products-list js-product-list">
    
   </div>

   <div class="cart-summary">
    <div class="heading-quant">
     <p>CART SUMMARY</p>
     <span>4 items</span>
    </div>

    <div class="prop-price">
     <p class="charges">
      Subtotal (4 items)
     </p>
     <p class="amount">$476.00</p>
    </div>
    <div class="prop-price">
     <p class="charges">
      Shippinh & Handling (2%)
     </p>
     <p class="amount">$40</p>
    </div>
    <div class="prop-price">
     <p class="charges">
      Sales Tax (12%)
     </p>
     <p class="amount">$86.99</p>
    </div>
    
    <div class="finish-quant">
     <p>Order Total</p>
     <span class="total-charge">$490.58</span>
    </div>
    <button class="add-to-cart">
        <img src="/images/icons/add-to-cart.png" alt="">
        Proceed to checkout
      </button>
   </div>
  </div>
 </main>

 <script type="module" src="/scripts/checkout.js"></script>
</body>
</html>
